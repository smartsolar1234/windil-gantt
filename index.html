<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#0d2137;direction:rtl;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;background:#fff}
.hdr{background:linear-gradient(135deg,#0a3a52,#1565a8);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:16px}
.hdr h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.live{background:rgba(46,204,113,.35);color:#aff5c8}
.filters{background:#f0f4f8;border-bottom:2px solid #dde;padding:9px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.fg{display:flex;align-items:center;gap:7px}
.fg label{font-size:11px;font-weight:700;color:#445;white-space:nowrap}
.fg select,.fg input{padding:5px 10px;border:1px solid #bcc;border-radius:6px;font-size:12px;background:#fff;color:#333;direction:rtl}
.fg input{width:160px}
.legend{display:flex;gap:12px;margin-right:auto;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#556}
.ld{width:13px;height:13px;border-radius:3px}

.lp-row:hover{background:#e8eef5}
.lp-row.proj{height:46px;background:#f4f6fa;font-weight:700;font-size:12px;color:#223}
.lp-row.task{height:28px;font-size:11px;color:#445;padding-right:22px;background:#fff}
.expand-btn{font-size:13px;margin-left:6px;color:#778;transition:transform .2s;flex-shrink:0;width:12px}
.expand-btn.open{transform:rotate(90deg)}
.pct-bar{height:5px;border-radius:2px;background:#e0e4ea;margin-top:3px;overflow:hidden;width:100%}
.pct-fill{height:100%;border-radius:2px;transition:width .3s}
.task-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-left:6px}
.done-dot{background:#27ae60}
.act-dot{background:#3498db}
.pend-dot{background:#bbb}
.cancel-dot{background:#95a5a6}
.ga-wrap{flex:1;overflow:auto;position:relative}
#ga{position:relative;min-height:100%}
#tlhdr{position:sticky;top:0;z-index:10;background:#e0e6ed;border-bottom:2px solid #ccd;display:flex;height:48px}
.month-cell{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;border-left:2px solid #bbc;font-size:11px;color:#334;font-weight:700;flex-shrink:0}
.mname{font-size:12px}
.mdays{font-size:10px;color:#778;font-weight:400}
#gi{position:relative}
.g-row{position:relative;border-bottom:1px solid #eef;background:#fff;display:flex;align-items:center}
.g-row.proj{height:46px;background:#f8f9fc}
.g-row.task{height:28px}
.gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.06);pointer-events:none}
.gl-m{background:rgba(0,0,0,.15);width:2px}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#e74c3c;z-index:8;pointer-events:none}
.today-label{position:absolute;top:0;background:#e74c3c;color:#fff;font-size:10px;padding:1px 5px;border-radius:0 0 4px 4px;z-index:9;white-space:nowrap}
.bar{position:absolute;border-radius:4px;top:50%;transform:translateY(-50%);cursor:pointer;min-width:5px}
.bar:hover{opacity:.8}
.b-active{background:linear-gradient(90deg,#3498db,#2980b9)}
.b-done{background:linear-gradient(90deg,#27ae60,#1e8449)}
.b-overdue{background:linear-gradient(90deg,#e74c3c,#c0392b)}
.b-pend{background:linear-gradient(90deg,#95a5a6,#7f8c8d)}
.b-wait{background:linear-gradient(90deg,#f39c12,#d68910)}
.b-cancel{background:linear-gradient(90deg,#bdc3c7,#95a5a6)}
.proj .bar{height:22px}
.task .bar{height:13px}
#tip{position:fixed;background:#1a2a3a;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;z-index:9999;display:none;min-width:200px;max-width:300px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}

.tr{display:flex;justify-content:space-between;gap:12px;margin:3px 0;font-size:11px}
.tl{color:#aac;font-weight:600}

רת קבלן והתקנה", "startDate": "", "endDate": "", "status": "פעיל", "done": false}, {"name": "תיאום בדיקה וחיבור", "startDate": "", "endDate": "", "status": "פעיל", "done": false}, {"name": "הגשה לחיבור חח\"י", "startDate": "", "endDate": "", "status": "פעיל", "done": false}, {"name": "חיבור ותשלום סופי", "startDate": "", "endDate": "", "status": "ממתין לטיפול", "done": false}]}, {"id": "288", "name": "ל.ט השקעות ונכסים בע\"מ", "client": "טל אשר", "type": "Off-Grid", "manager": "מוטי ברטל", "receivedDate": "", "startDate": "", "endDate": "", "status": "פעיל", "doneCount": 0, "totalTasks": 0, "tasks": []}, {"id": "348", "name": "סייף הגדלה", "client": "דר' סייף ושות", "type": "מערכות אוף גריד", "manager": "מור שם טוב", "receivedDate": "28/04/2025", "startDate": "28/04/2025", "endDate": "", "status": "פעיל", "doneCount": 0, "totalTasks": 1, "tasks": [{"name": "תשלום רביעי", "startDate": "", "endDate": "", "status": "ממתין לטיפול", "done": false}]}, {"id": "345", "name": "מכולה 4", "client": "אפקון תחבורה חשמלית בע\"מ", "type": "מכירת ציד ויקטרון", "manager": "מור שם טוב", "receivedDate": "28/04/2025", "startDate": "28/04/2025", "endDate": "", "status": "פעיל", "doneCount": 0, "totalTasks": 0, "tasks": []}];
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const DW=14;
let expanded=new Set();

function pd(s){
  if(!s)return null;
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m)return null;
  const d=new Date(+m[3],+m[2]-1,+m[1]);d.setHours(0,0,0,0);
  return isNaN(d)?null:d;
}
function fd(d){return d?d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';}
function diff(a,b){return Math.round((b-a)/86400000);}
function dayOff(d){return diff(minDate,d);}

let minDate=null,maxDate=null;
RAW.forEach(p=>{
  [p.startDate,p.endDate,p.receivedDate].forEach(s=>{
    const d=pd(s);if(!d)return;
    if(!minDate||d<minDate)minDate=d;
    if(!maxDate||d>maxDate)maxDate=d;
  });
  (p.tasks||[]).forEach(t=>{
    [t.startDate,t.endDate].forEach(s=>{
      const d=pd(s);if(!d)return;
      if(!minDate||d<minDate)minDate=d;
      if(!maxDate||d>maxDate)maxDate=d;
    });
  });
});
minDate=new Date(Math.min(minDate||TODAY,TODAY)-30*86400000);minDate.setHours(0,0,0,0);
maxDate=new Date(Math.max(maxDate||TODAY,TODAY)+45*86400000);maxDate.setHours(0,0,0,0);
const TOTAL_DAYS=diff(minDate,maxDate);

function barCls(status,endDate){
  const ed=pd(endDate);
  if(ed&&ed<TODAY&&status!=='הושלם'&&status!=='בוטל')return 'b-overdue';
  if(status==='הושלם'||status==='בוצע')return 'b-done';
  if(status==='בוטל')return 'b-cancel';
  if(status==='ממתין לטיפול')return 'b-pend';
  if(status==='בהמתנה')return 'b-wait';
  return 'b-active';
}
function pctColor(pct){
  if(pct>=100)return '#27ae60';
  if(pct>=50)return '#3498db';
  if(pct>=20)return '#f39c12';
  return '#e74c3c';
}

let tipEl;
function showTip(e,title,rows){
  if(!tipEl)tipEl=document.getElementById('tip');
  tipEl.innerHTML='<div class="tt">'+title+'</div>'+rows.map(([l,v])=>'<div class="tr"><span class="tl">'+l+'</span><span>'+v+'</span></div>').join('');
  tipEl.style.display='block';moveTip(e);
}
function moveTip(e){if(!tipEl)return;tipEl.style.left=Math.min(e.clientX+15,window.innerWidth-310)+'px';tipEl.style.top=Math.min(e.clientY+15,window.innerHeight-160)+'px';}
function hideTip(){if(tipEl)tipEl.style.display='none';}
document.addEventListener('mousemove',moveTip);

function buildHeader(){
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  const hdr=document.getElementById('tlhdr');
  let cur=null,html='';
  for(let i=0;i<=TOTAL_DAYS;i++){
    const d=new Date(minDate.getTime()+i*86400000);
    const key=d.getFullYear()*12+d.getMonth();
    if(key!==cur){
      let cnt=0,j=i;
      while(j<=TOTAL_DAYS&&(new Date(minDate.getTime()+j*86400000).getFullYear()*12+new Date(minDate.getTime()+j*86400000).getMonth())===key){cnt++;j++;}
      html+='<div class="month-cell" style="width:'+(cnt*DW)+'px;min-width:'+(cnt*DW)+'px"><span class="mname">'+months[d.getMonth()]+' '+d.getFullYear()+'</span><span class="mdays">'+cnt+' ימים</span></div>';
      cur=key;
    }
  }
  hdr.innerHTML=html;hdr.style.width=(TOTAL_DAYS*DW)+'px';
}
function buildGrid(){
  const gi=document.getElementById('gi');
  let html='';
  for(let i=0;i<=TOTAL_DAYS;i++){
    const d=new Date(minDate.getTime()+i*86400000);
    if(d.getDate()===1)html+='<div class="gl gl-m" style="left:'+(i*DW)+'px;top:0"></div>';
    else if(d.getDay()===0)html+='<div class="gl" style="left:'+(i*DW)+'px;top:0"></div>';
  }
  const g=document.createElement('div');
  g.style.cssText='position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1';
  g.innerHTML=html;gi.appendChild(g);
}
function buildToday(){
  const gi=document.getElementById('gi');
  const off=dayOff(TODAY)*DW;
  const line=document.createElement('div');line.className='today-line';line.style.left=off+'px';
  const lbl=document.createElement('div');lbl.className='today-label';lbl.style.left=(off-15)+'px';lbl.textContent='היום';
  gi.appendChild(line);gi.appendChild(lbl);
}
function initFilters(){
  const mgrs=[...new Set(RAW.map(p=>p.manager).filter(Boolean))].sort();
  const stats=[...new Set(RAW.map(p=>p.status).filter(Boolean))].sort();
  const mSel=document.getElementById('f-mgr');
  mgrs.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;mSel.appendChild(o);});
  const sSel=document.getElementById('f-status');
  stats.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sSel.appendChild(o);});
  [mSel,sSel,document.getElementById('f-search')].forEach(el=>el.addEventListener('input',render));
}
function getFiltered(){
  const mgr=document.getElementById('f-mgr').value;
  const stat=document.getElementById('f-status').value;
  const q=document.getElementById('f-search').value.trim().toLowerCase();
  return RAW.filter(p=>(!mgr||p.manager===mgr)&&(!stat||p.status===stat)&&(!q||(p.name+' '+p.client).toLowerCase().includes(q)));
}
const W=TOTAL_DAYS*DW;
function render(){
  const filtered=getFiltered();
  const lpRows=document.getElementById('lp-rows');
  const gRows=document.getElementById('g-rows');
  lpRows.innerHTML='';gRows.innerHTML='';
  filtered.forEach(p=>{
    const isOpen=expanded.has(p.id);
    const tasks=p.tasks||[];
    const doneCnt=tasks.filter(t=>t.done).length;
    const pct=tasks.length?Math.round(doneCnt/tasks.length*100):0;
    const color=pctColor(pct);

    const lpr=document.createElement('div');
    lpr.className='lp-row proj';
    lpr.innerHTML='<span class="expand-btn'+(isOpen?' open':'')+'">▶</span>'+
      '<div style="flex:1;min-width:0;margin-right:4px">'+
        '<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="'+p.name+'">'+p.name+'</div>'+
        '<div class="pct-bar"><div class="pct-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
      '</div>'+
      '<span style="font-size:11px;color:'+color+';font-weight:700;margin-right:6px;flex-shrink:0">'+pct+'%</span>';
    lpr.addEventListener('click',()=>{if(expanded.has(p.id))expanded.delete(p.id);else expanded.add(p.id);render();});
    lpr.addEventListener('mouseenter',e=>showTip(e,p.name,[
      ['לקוח',p.client||'—'],['מנהל',p.manager||'—'],['סוג',p.type||'—'],
      ['סטטוס',p.status||'—'],['התקדמות',pct+'% ('+doneCnt+'/'+tasks.length+')'],
      ['תחילה',p.startDate||p.receivedDate||'—'],['סיום',p.endDate||'—']
    ]));
    lpr.addEventListener('mouseleave',hideTip);
    lpRows.appendChild(lpr);

    const gpr=document.createElement('div');
    gpr.className='g-row proj';gpr.style.width=W+'px';
    const sd=pd(p.startDate||p.receivedDate),ed=pd(p.endDate);
    if(sd&&ed){
      const bar=document.createElement('div');
      bar.className='bar '+barCls(p.status,p.endDate);
      bar.style.cssText='left:'+(dayOff(sd)*DW)+'px;width:'+Math.max((diff(sd,ed)+1)*DW,8)+'px';
      bar.addEventListener('mouseenter',e=>showTip(e,p.name,[['תחילה',fd(sd)],['סיום',fd(ed)],['סטטוס',p.status||'—']]));
      bar.addEventListener('mouseleave',hideTip);
      gpr.appendChild(bar);
    }else if(sd){
      const bar=document.createElement('div');
      bar.className='bar '+barCls(p.status,'');
      bar.style.cssText='left:'+(dayOff(sd)*DW)+'px;width:40px';
      gpr.appendChild(bar);
    }
    gRows.appendChild(gpr);

    if(isOpen){
      tasks.forEach(t=>{
        const tlr=document.createElement('div');
        tlr.className='lp-row task';
        let dotCls='pend-dot';
        if(t.done)dotCls='done-dot';
        else if(t.status==='פעיל')dotCls='act-dot';
        else if(t.status==='בוטל')dotCls='cancel-dot';
        tlr.innerHTML='<div class="task-dot '+dotCls+'"></div>'+
          '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+t.name+'</span>'+
          '<span style="font-size:10px;color:#889;margin-right:4px">'+(t.done?'✓':'')+'</span>';
        tlr.addEventListener('mouseenter',e=>showTip(e,t.name,[
          ['פרויקט',p.name],['תחילה',t.startDate||'—'],['סיום',t.endDate||'—'],['סטטוס',t.status||'—']
        ]));
        tlr.addEventListener('mouseleave',hideTip);
        lpRows.appendChild(tlr);

        const gtr=document.createElement('div');
        gtr.className='g-row task';gtr.style.width=W+'px';
        const ts=pd(t.startDate),te=pd(t.endDate);
        if(ts&&te){
          const tb=document.createElement('div');
          tb.className='bar '+barCls(t.status,t.endDate);
          tb.style.cssText='left:'+(dayOff(ts)*DW)+'px;width:'+Math.max((diff(ts,te)+1)*DW,4)+'px';
          tb.addEventListener('mouseenter',e=>showTip(e,t.name,[['תחילה',fd(ts)],['סיום',fd(te)],['סטטוס',t.status||'—']]));
          tb.addEventListener('mouseleave',hideTip);
          gtr.appendChild(tb);
        }else if(ts){
          const tb=document.createElement('div');
          tb.className='bar';
          tb.style.cssText='left:'+(dayOff(ts)*DW)+'px;width:10px;background:'+(t.done?'#27ae60':'#5b8dd9')+';height:13px';
          gtr.appendChild(tb);
        }
        gRows.appendChild(gtr);
      });
    }
  });
  document.getElementById('b-proj').textContent=filtered.length+' פרויקטים';
  document.getElementById('b-tasks').textContent=filtered.reduce((s,p)=>s+(p.tasks||[]).length,0)+' משימות';
}
function syncScroll(){
  const lp=document.getElementById('lp'),ga=document.querySelector('.ga-wrap');
  ga.addEventListener('scroll',()=>lp.scrollTop=ga.scrollTop);
  lp.addEventListener('scroll',()=>ga.scrollTop=lp.scrollTop);
}
async function init(){
  buildHeader();buildGrid();buildToday();initFilters();syncScroll();render();
  document.getElementById('gi').style.width=(TOTAL_DAYS*DW)+'px';
  setTimeout(()=>{const ga=document.querySelector('.ga-wrap');ga.scrollLeft=Math.max(0,dayOff(TODAY)*DW-350);},100);
}
document.addEventListener('DOMContentLoaded',init);
</script>
