<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windil – תרשים גאנט פרויקטים</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#0d2137;direction:rtl;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh;background:#fff}
.hdr{background:linear-gradient(135deg,#0a3a52,#1565a8);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:16px}
.hdr h1{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.18);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.saved{background:rgba(46,204,113,.35);color:#aff5c8}
.filters{background:#f0f4f8;border-bottom:2px solid #dde;padding:9px 20px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.fg{display:flex;align-items:center;gap:7px}
.fg label{font-size:11px;font-weight:700;color:#445;white-space:nowrap}
.fg select,.fg input{padding:5px 10px;border:1px solid #bcc;border-radius:6px;font-size:12px;background:#fff;color:#333;direction:rtl}
.fg input{width:150px}
.legend{display:flex;gap:12px;margin-right:auto;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#556}
.ld{width:13px;height:13px;border-radius:3px}
.main{display:flex;flex:1;overflow:hidden}
.lp{width:290px;flex-shrink:0;border-left:2px solid #dde;background:#fafbfc;overflow-y:auto;overflow-x:hidden}
.lp-hdr{background:#e0e6ed;padding:8px 12px;font-size:11px;font-weight:700;color:#334;border-bottom:1px solid #ccd;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between}
.lp-row{display:flex;align-items:center;padding:0 8px;border-bottom:1px solid #eef;cursor:pointer;user-select:none;transition:background .15s}
.lp-row:hover{background:#e8eef5}
.lp-row.proj{height:44px;background:#f4f6fa;font-weight:700;font-size:12px;color:#223}
.lp-row.proj:hover{background:#dde4ee}
.lp-row.task{height:30px;font-size:11px;color:#445;padding-right:20px;background:#fff}
.lp-row.task:hover{background:#f0f4ff}
.expand-btn{font-size:14px;margin-left:6px;color:#778;transition:transform .2s}
.expand-btn.open{transform:rotate(90deg)}
.pct-bar{height:4px;border-radius:2px;background:#e0e4ea;margin-top:3px;overflow:hidden}
.pct-fill{height:100%;border-radius:2px;background:#2ecc71;transition:width .3s}
.task-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-left:6px}
.done-dot{background:#27ae60}
.pend-dot{background:#bbb}
.ga-wrap{flex:1;overflow:auto;position:relative}
#ga{position:relative;min-height:100%}
#tlhdr{position:sticky;top:0;z-index:10;background:#e0e6ed;border-bottom:2px solid #ccd;display:flex;height:48px}
.month-cell{display:inline-flex;flex-direction:column;justify-content:center;align-items:center;border-left:2px solid #bbc;font-size:11px;color:#334;font-weight:700;flex-shrink:0}
.mname{font-size:12px}
.mdays{font-size:10px;color:#778;font-weight:400}
#gi{position:relative}
.g-row{position:relative;border-bottom:1px solid #eef;background:#fff;display:flex;align-items:center}
.g-row.proj{height:44px;background:#f8f9fc}
.g-row.task{height:30px}
.gl{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.06);pointer-events:none}
.gl-m{background:rgba(0,0,0,.15);width:2px}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#e74c3c;z-index:8;pointer-events:none}
.today-label{position:absolute;top:0;background:#e74c3c;color:#fff;font-size:10px;padding:1px 5px;border-radius:0 0 4px 4px;z-index:9;white-space:nowrap}
.bar{position:absolute;border-radius:5px;top:50%;transform:translateY(-50%);cursor:pointer;transition:opacity .15s;min-width:6px}
.bar:hover{opacity:.85}
.b-active{background:linear-gradient(90deg,#3498db,#2980b9)}
.b-done{background:linear-gradient(90deg,#27ae60,#1e8449)}
.b-overdue{background:linear-gradient(90deg,#e74c3c,#c0392b)}
.b-pend{background:linear-gradient(90deg,#95a5a6,#7f8c8d)}
.b-wait{background:linear-gradient(90deg,#f39c12,#d68910)}
.b-cancel{background:linear-gradient(90deg,#bdc3c7,#95a5a6)}
.proj .bar{height:22px}
.task .bar{height:14px;border-radius:4px}
.diamond{position:absolute;width:12px;height:12px;border-radius:2px;top:50%;transform:translateY(-50%) rotate(45deg);cursor:pointer;z-index:5;transition:opacity .15s}
.diamond:hover{opacity:.75}
#tip{position:fixed;background:#1a2a3a;color:#fff;padding:10px 14px;border-radius:8px;font-size:12px;z-index:9999;display:none;min-width:200px;max-width:280px;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.tt{font-weight:700;font-size:13px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:6px}
.tr{display:flex;justify-content:space-between;gap:12px;margin:3px 0;font-size:11px}
.tl{color:#aac;font-weight:600}
</style>
</head>

, "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "חיבור חח\"י", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "תשלום 4", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}]}, {"id": "341", "name": "ש.נ. שיקום וניהול/שירלי גינסברג", "client": "ש.נ. שיקום וניהול", "type": "", "manager": "", "receivedDate": "28/01/2025", "startDate": "28/01/2025", "endDate": "", "status": "פעיל", "doneCount": 0, "totalTasks": 12, "tasks": [{"name": "רישום באתר", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "מקדמה", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "טפסים מהלקוח", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "הדמיה", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "אישור התקנה", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "הזמנת ציוד", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "תשלום 2", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "התקנה", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "תשלום 3", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "בדיקה בודק", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "חיבור חח\"י", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}, {"name": "תשלום 4", "crmName": "", "startDate": "", "endDate": "", "status": "", "done": false}]}];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const DW = 14;
const LS_KEY = "windil_gantt_v2";
let expanded = new Set();
let taskDone = {};
function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d) {
      if (Array.isArray(d.expanded)) expanded = new Set(d.expanded);
      if (d.taskDone) taskDone = d.taskDone;
    }
  } catch(e) {}
}
let _saveTimer = null;
function saveState() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({expanded:[...expanded],taskDone,updatedAt:new Date().toISOString()}));
      const badge = document.getElementById('b-save');
      badge.style.display = '';
      setTimeout(() => badge.style.display = 'none', 2000);
    } catch(e) {}
  }, 400);
}
function pd(s) {
  if (!s) return null;
  const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (!m) return null;
  const dt = new Date(+m[3],+m[2]-1,+m[1]); dt.setHours(0,0,0,0);
  return isNaN(dt)?null:dt;
}
function fd(d) { return d?d.toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}):'—'; }
function diff(a,b) { return Math.round((b-a)/86400000); }
function dayOff(d) { return diff(minDate,d); }
let minDate=null, maxDate=null;
RAW.forEach(p => {
  [p.startDate,p.endDate,p.receivedDate].forEach(s => {
    const d=pd(s); if(!d) return;
    if(!minDate||d<minDate) minDate=d;
    if(!maxDate||d>maxDate) maxDate=d;
  });
  p.tasks.forEach(t => {
    [t.startDate,t.endDate].forEach(s => {
      const d=pd(s); if(!d) return;
      if(!minDate||d<minDate) minDate=d;
      if(!maxDate||d>maxDate) maxDate=d;
    });
  });
});
minDate = new Date(Math.min(minDate||TODAY, TODAY) - 45*86400000); minDate.setHours(0,0,0,0);
maxDate = new Date(Math.max(maxDate||TODAY, TODAY) + 60*86400000); maxDate.setHours(0,0,0,0);
const TOTAL_DAYS = diff(minDate, maxDate);
function barCls(status, endDate) {
  const ed=pd(endDate);
  if (ed && ed<TODAY && status!=='הושלם' && status!=='בוטל') return 'b-overdue';
  if (status==='הושלם') return 'b-done';
  if (status==='בוטל') return 'b-cancel';
  if (status==='ממתין לטיפול') return 'b-pend';
  if (status==='בהמתנה') return 'b-wait';
  return 'b-active';
}
function taskColor(done) { return done ? '#27ae60' : '#5b8dd9'; }
function isTaskDone(projId, taskName, crmDone) {
  const override = taskDone[projId]?.[taskName];
  if (override !== undefined) return override;
  return crmDone;
}
function toggleTask(projId, taskName, crmDone) {
  if (!taskDone[projId]) taskDone[projId] = {};
  const current = isTaskDone(projId, taskName, crmDone);
  taskDone[projId][taskName] = !current;
  saveState(); render();
}
let tipEl;
function showTip(e, title, rows) {
  if(!tipEl) tipEl=document.getElementById('tip');
  const rowsHtml = rows.map(([l,v])=>`<div class="tr"><span class="tl">${l}</span><span>${v}</span></div>`).join('');
  tipEl.innerHTML = `<div class="tt">${title}</div>${rowsHtml}`;
  tipEl.style.display='block'; moveTip(e);
}
function moveTip(e) { if(!tipEl) return; tipEl.style.left=Math.min(e.clientX+15,window.innerWidth-290)+'px'; tipEl.style.top=Math.min(e.clientY+15,window.innerHeight-160)+'px'; }
function hideTip() { if(tipEl) tipEl.style.display='none'; }
document.addEventListener('mousemove', moveTip);
function buildHeader() {
  const hdr=document.getElementById('tlhdr');
  const months=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  let cur=null, html='';
  for(let i=0;i<=TOTAL_DAYS;i++){
    const d=new Date(minDate.getTime()+i*86400000);
    const key=d.getFullYear()*12+d.getMonth();
    if(key!==cur){
      let cnt=0; let j=i;
      while(j<=TOTAL_DAYS){
        const dd=new Date(minDate.getTime()+j*86400000);
        if(dd.getFullYear()*12+dd.getMonth()!==key) break;
        cnt++; j++;
      }
      const w=cnt*DW;
      html+=`<div class="month-cell" style="width:${w}px;min-width:${w}px"><span class="mname">${months[d.getMonth()]} ${d.getFullYear()}</span><span class="mdays">${cnt} ימים</span></div>`;
      cur=key;
    }
  }
  hdr.innerHTML=html;
  hdr.style.width=(TOTAL_DAYS*DW)+'px';
}
function buildGrid() {
  const gi=document.getElementById('gi');
  let html='';
  for(let i=0;i<=TOTAL_DAYS;i++){
    const d=new Date(minDate.getTime()+i*86400000);
    if(d.getDate()===1) html+=`<div class="gl gl-m" style="left:${i*DW}px;top:48px"></div>`;
    else if(d.getDay()===0) html+=`<div class="gl" style="left:${i*DW}px;top:48px"></div>`;
  }
  const g=document.createElement('div');
  g.style.cssText='position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:1';
  g.innerHTML=html; gi.appendChild(g);
}
function buildToday() {
  const gi=document.getElementById('gi');
  const off=dayOff(TODAY)*DW;
  const line=document.createElement('div');
  line.className='today-line'; line.style.left=off+'px';
  const lbl=document.createElement('div');
  lbl.className='today-label'; lbl.style.left=(off-20)+'px';
  lbl.textContent='היום';
  gi.appendChild(line); gi.appendChild(lbl);
}
function initFilters() {
  const mgrs=[...new Set(RAW.map(p=>p.manager).filter(Boolean))].sort();
  const statuses=[...new Set(RAW.map(p=>p.status).filter(Boolean))].sort();
  const mSel=document.getElementById('f-mgr');
  mgrs.forEach(m=>{ const o=document.createElement('option'); o.value=m; o.textContent=m; mSel.appendChild(o); });
  const sSel=document.getElementById('f-status');
  statuses.forEach(s=>{ const o=document.createElement('option'); o.value=s; o.textContent=s; sSel.appendChild(o); });
  [mSel,sSel,document.getElementById('f-search')].forEach(el=>el.addEventListener('input',render));
}
function getFiltered() {
  const mgr=document.getElementById('f-mgr').value;
  const stat=document.getElementById('f-status').value;
  const q=document.getElementById('f-search').value.trim().toLowerCase();
  return RAW.filter(p=>(!mgr||p.manager===mgr)&&(!stat||p.status===stat)&&(!q||(p.name+p.client).toLowerCase().includes(q)));
}
const W = TOTAL_DAYS * DW;
function render() {
  const filtered = getFiltered();
  const lpRows = document.getElementById('lp-rows');
  const gRows  = document.getElementById('g-rows');
  lpRows.innerHTML = ''; gRows.innerHTML = '';
  filtered.forEach(p => {
    const isOpen = expanded.has(p.id);
    const doneCnt = p.tasks.filter(t => isTaskDone(p.id, t.name, t.done)).length;
    const pct = p.totalTasks ? Math.round(doneCnt/p.totalTasks*100) : 0;
    const lpr=document.createElement('div');
    lpr.className='lp-row proj';
    lpr.innerHTML=`<span class="expand-btn ${isOpen?'open':''}">▶</span><div style="flex:1;overflow:hidden;margin-right:4px"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${p.name}">${p.name}</div><div class="pct-bar"><div class="pct-fill" style="width:${pct}%"></div></div></div><span style="font-size:11px;color:#667;white-space:nowrap">${pct}%</span>`;
    lpr.addEventListener('click',()=>{ if(expanded.has(p.id)) expanded.delete(p.id); else expanded.add(p.id); saveState(); render(); });
    lpr.addEventListener('mouseenter',e=>showTip(e,p.name,[['לקוח',p.client||'—'],['מנהל',p.manager||'—'],['סוג',p.type||'—'],['סטטוס',p.status||'—'],['התקדמות',pct+'% ('+doneCnt+'/'+p.totalTasks+')'],['תחילה',p.startDate||p.receivedDate||'—'],['סיום',p.endDate||'—']]));
    lpr.addEventListener('mouseleave',hideTip);
    lpRows.appendChild(lpr);
    const gpr=document.createElement('div');
    gpr.className='g-row proj'; gpr.style.width=W+'px';
    const sd=pd(p.startDate), ed=pd(p.endDate);
    if(sd && ed){
      const left=dayOff(sd)*DW;
      const width=Math.max((diff(sd,ed)+1)*DW, 6);
      const cls=barCls(p.status, p.endDate);
      const barEl=document.createElement('div');
      barEl.className='bar '+cls;
      barEl.style.cssText=`left:${left}px;width:${width}px`;
      barEl.addEventListener('mouseenter',e=>showTip(e,p.name,[['תחילה',fd(sd)],['סיום',fd(ed)],['ימים',diff(sd,ed)+1],['סטטוס',p.status||'—']]));
      barEl.addEventListener('mouseleave',hideTip);
      gpr.appendChild(barEl);
    }
    gRows.appendChild(gpr);
    if(isOpen){
      p.tasks.forEach(t => {
        const done=isTaskDone(p.id, t.name, t.done);
        const tlr=document.createElement('div');
        tlr.className='lp-row task';
        tlr.innerHTML=`<div class="task-dot ${done?'done-dot':'pend-dot'}"></div><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.name}</span><span style="font-size:10px;color:#889;margin-right:4px">${done?'✓':''}</span>`;
        tlr.style.cursor='pointer';
        tlr.addEventListener('click',()=>toggleTask(p.id, t.name, t.done));
        tlr.addEventListener('mouseenter',e=>showTip(e,t.name,[['פרויקט',p.name],['CRM',t.crmName||'—'],['תחילה',t.startDate||'—'],['סיום',t.endDate||'—'],['סטטוס',t.status||'—'],['מצב',done?'✅ בוצע':'⏳ ממתין']]));
        tlr.addEventListener('mouseleave',hideTip);
        lpRows.appendChild(tlr);
        const gtr=document.createElement('div');
        gtr.className='g-row task'; gtr.style.width=W+'px';
        const ts=pd(t.startDate), te=pd(t.endDate);
        const color=taskColor(done);
        if(ts && te){
          const left=dayOff(ts)*DW;
          const width=Math.max((diff(ts,te)+1)*DW, 4);
          const tb=document.createElement('div');
          tb.className='bar';
          tb.style.cssText=`left:${left}px;width:${width}px;background:${color};height:14px`;
          tb.addEventListener('click',()=>toggleTask(p.id, t.name, t.done));
          tb.addEventListener('mouseenter',e=>showTip(e,t.name,[['תחילה',fd(ts)],['סיום',fd(te)],['ימים',diff(ts,te)+1],['מצב',done?'✅ בוצע':'⏳ ממתין']]));
          tb.addEventListener('mouseleave',hideTip);
          gtr.appendChild(tb);
        } else {
          const projStart=pd(p.startDate)||pd(p.receivedDate);
          if(projStart){
            const dm=document.createElement('div');
            dm.className='diamond';
            dm.style.cssText=`left:${dayOff(projStart)*DW-5}px;background:${done?'#27ae60':'#ccc'}`;
            dm.title=t.name+(done?' ✓':' (ללא תאריך)');
            dm.addEventListener('click',()=>toggleTask(p.id, t.name, t.done));
            gtr.appendChild(dm);
          }
        }
        gRows.appendChild(gtr);
      });
    }
  });
  document.getElementById('b-proj').textContent=filtered.length+' פרויקטים';
  const tt=filtered.reduce((s,p)=>s+p.totalTasks,0);
  document.getElementById('b-tasks').textContent=tt+' משימות';
}
function syncScroll(){
  const lp=document.getElementById('lp'), ga=document.getElementById('ga');
  ga.addEventListener('scroll',()=>{ lp.scrollTop=ga.scrollTop; });
  lp.addEventListener('scroll',()=>{ ga.scrollTop=lp.scrollTop; });
}
async function init(){
  loadState();
  document.getElementById('b-date').textContent='עודכן 01/08/2026';
  buildHeader(); buildGrid(); buildToday(); initFilters(); syncScroll(); render();
  document.getElementById('gi').style.width=(TOTAL_DAYS*DW)+'px';
  setTimeout(()=>{ const ga=document.getElementById('ga'); ga.scrollLeft=Math.max(0,dayOff(TODAY)*DW-350); },100);
}
document.addEventListener('DOMContentLoaded',init);
</script>
